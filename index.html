<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PASSO URBANO — Loja Virtual de Tênis</title>
    <meta name="description" content="Loja virtual profissional especializada em tênis esportivos, casuais, urbanos e acessórios, com controle atômico de estoque e painel exclusivo do vendedor." />
    <meta property="og:title" content="PASSO URBANO — Loja Virtual de Tênis" />
    <meta property="og:description" content="Loja virtual profissional especializada em tênis esportivos, casuais, urbanos e acessórios." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-zinc-950 antialiased selection:bg-lime-300 selection:text-zinc-950">
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:#18181b">
        <p>Carregando a PASSO URBANO...</p>
      </main>
    </div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const entry = document.getElementById('app-entry');
        const showStartupError = (message) => {
          if (!root || root.dataset.moduleLoaded === 'true') return;
          root.replaceChildren();
          const panel = document.createElement('main');
          panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:#18181b;background:#fff';
          const card = document.createElement('section');
          card.style.cssText = 'max-width:720px;width:100%;padding:28px;border:1px solid #d4d4d8;border-radius:14px;box-sizing:border-box';
          const title = document.createElement('h1');
          title.textContent = 'A loja não conseguiu iniciar';
          title.style.cssText = 'font-size:22px;margin:0 0 12px';
          const description = document.createElement('p');
          description.textContent = 'O carregamento do JavaScript falhou. Este detalhe ajuda a localizar a causa:';
          description.style.cssText = 'font-size:14px;line-height:1.5;color:#52525b';
          const detail = document.createElement('pre');
          detail.textContent = String(message || 'Falha sem mensagem adicional').slice(0, 3000);
          detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f5;padding:14px;border-radius:8px;font-size:12px;color:#27272a';
          card.append(title, description, detail);
          panel.append(card);
          root.append(panel);
        };
        if (entry) entry.addEventListener('load', () => {
          if (root) root.dataset.moduleLoaded = 'true';
        });
        window.addEventListener('error', (event) => {
          if (event.target === entry || event.message) {
            showStartupError(event.message || 'Não foi possível carregar o arquivo principal da aplicação.');
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          showStartupError(event.reason && event.reason.message ? event.reason.message : event.reason);
        });
      })();
    </script>
    <script type="module" id="app-entry" src="/src/main.tsx"></script>
  </body>
</html>
